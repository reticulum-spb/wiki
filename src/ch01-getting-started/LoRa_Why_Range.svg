<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310" role="img" aria-labelledby="title desc">
  <title id="title">Сравнение дальности и пропускной способности LoRa</title>
  <desc id="desc">Перекрывающиеся области сравнивают Wi-Fi и BLE, сотовую связь и LoRa по пропускной способности и дальности.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#111"/>
    </marker>
  </defs>

  <rect width="600" height="310" fill="#fff"/>

  <g fill="none" stroke="#111" stroke-width="2" marker-end="url(#arrow)">
    <path d="M120 264 V23"/>
    <path d="M120 264 H577"/>
  </g>

  <ellipse cx="211" cy="106" rx="74" ry="92" fill="#ff9e13"/>
  <ellipse cx="372" cy="70" rx="123" ry="61" fill="#f71920" fill-opacity="0.9"/>
  <ellipse cx="342" cy="181" rx="205" ry="75" fill="#19a9da" fill-opacity="0.85"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111" text-anchor="middle">
    <g font-size="14">
      <text x="82" y="46">Высокая</text>
      <text x="82" y="254">Низкая</text>
      <text x="150" y="286">Малая</text>
      <text x="550" y="286">Большая</text>
    </g>
    <g font-size="16">
      <text x="28" y="145" transform="rotate(-90 28 145)">Пропускная способность</text>
      <text x="343" y="286">Дальность</text>
    </g>

    <g font-size="20">
      <text x="209" y="88">Wi-Fi</text>
      <text x="209" y="113">BLE</text>
      <text x="372" y="43">Сотовая связь</text>
    </g>
    <g font-size="12">
      <text x="209" y="133">Видео / Голос</text>
      <text x="209" y="147">Бытовой IoT</text>
      <text x="372" y="61">Критически важные задачи</text>
      <text x="372" y="75">вне помещений</text>
      <text x="372" y="89">Повышенное энергопотребление</text>
      <text x="352" y="211">Датчики, исполнительные устройства и метки</text>
      <text x="352" y="227">Минимальное энергопотребление</text>
      <text x="352" y="241">и минимальная стоимость</text>
    </g>
  </g>

  <g fill="#fff" font-family="Arial, Helvetica, sans-serif">
    <text x="301" y="179" font-size="40" font-weight="700" letter-spacing="-2">LoRa</text>
    <text x="394" y="163" font-size="10">®</text>
  </g>
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
    <path d="M321 145 Q334 136 347 145"/>
    <path d="M325 150 Q334 144 343 150"/>
    <path d="M329 155 Q334 152 339 155"/>
    <path d="M321 188 Q334 197 347 188"/>
    <path d="M325 183 Q334 189 343 183"/>
  </g>
</svg>
